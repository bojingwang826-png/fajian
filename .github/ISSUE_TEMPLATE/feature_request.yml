name: 功能建议
description: 提出产品或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你希望看到的操作流程或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式
      description: 如果有，请说明现在如何解决。
